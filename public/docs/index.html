      --bg-glass-hover: rgba(255, 255, 255, 0.18);

      --red-glow: rgba(236, 65, 65, 0.2);

      --bg-code-block: #f4f6fa;

    body {

    .content {

    .markdown-section h1 {

    .markdown-section h2 {
      font-size: 1.6rem;
      font-weight: 600;

    .markdown-section p {
      margin: 14px 0;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.8;
    }

    .markdown-section a {
      color: var(--red);
      text-decoration: none;
      border-bottom: 1.5px solid transparent;
      transition: all var(--transition);
      font-weight: 500;
    }

    .markdown-section a:hover {
      border-bottom-color: var(--red);
      color: var(--red-dark);
    }

    .markdown-section ul,
    .markdown-section ol {
      padding-left: 24px;
      margin: 12px 0;
    }

    .markdown-section li {
      margin: 4px 0;
      color: var(--text-secondary);
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--red);
      background: var(--bg-glass);
      padding: 16px 24px;
      margin: 20px 0;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-secondary);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .markdown-section blockquote p {
      margin: 0;
      color: inherit;
    }

    /* ----- 代码（高级暗色风格） ----- */
    .markdown-section code {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.82em;
      background: var(--bg-code);
      color: var(--red);
      padding: 2px 10px;
      border-radius: 6px;
      font-weight: 500;
      border: 1px solid var(--border-glass);
    }

    .markdown-section pre {
      background: var(--bg-code-block) !important;
      border-radius: var(--radius-sm);
      padding: 20px 24px;
      overflow-x: auto;
      margin: 20px 0;
      border: 1px solid var(--border-glass);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .markdown-section pre code {
      background: transparent !important;
      color: #e4e4f0 !important;
      padding: 0 !important;
      font-size: 0.82rem;
      line-height: 1.8;
      font-weight: 400;
      border: none !important;
    }

    [data-theme="light"] .markdown-section pre code {
      color: #1a1a2e !important;
    }

    /* ----- 表格 ----- */
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      font-size: 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .markdown-section table thead {
      background: var(--red);
      color: #fff;
    }

    .markdown-section table th {
      font-weight: 600;
      padding: 12px 18px;
      text-align: left;
    }

    .markdown-section table td {
      padding: 10px 18px;
      border-bottom: 1px solid var(--border-glass);
      color: var(--text-secondary);
    }

    .markdown-section table tbody tr:last-child td {
      border-bottom: none;
    }

    .markdown-section table tbody tr:nth-child(even) {
      background: var(--bg-glass);
    }

    .markdown-section table tbody tr:hover {
      background: var(--bg-glass-hover);
    }

    /* ----- 图片 ----- */
    .markdown-section img {
      max-width: 100%;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-glass);
    }

    /* ----- 分割线 ----- */
    .markdown-section hr {
      border: none;
      border-top: 1px solid var(--border-glass);
      margin: 40px 0;
    }

    /* ================================================================
       顶部导航 — 独立毛玻璃
       ================================================================ */
    .app-nav {
      display: flex;
      gap: 24px;
      align-items: center;
      padding: 12px 24px;
      margin-bottom: 28px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      box-shadow: var(--shadow-glass);
      flex-wrap: wrap;
    }

    .app-nav a {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 14px;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: all var(--transition);
      text-decoration: none;
    }

    .app-nav a:hover {
      color: var(--text-primary);
      border-bottom-color: var(--red);
    }

    .app-nav a::before {
      display: none !important;
    }

    /* ================================================================
       搜索框 — 毛玻璃
       ================================================================ */
    .search .input-wrap input {
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      padding: 8px 16px 8px 38px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all var(--transition);
      width: 100%;
      font-family: inherit;
    }

    .search .input-wrap input::placeholder {
      color: var(--text-muted);
    }

    .search .input-wrap input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
      outline: none;
    }

    .search .input-wrap .search-icon {
      color: var(--text-muted);
    }

    .results-panel {
      background: var(--bg-sidebar);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      margin-top: 8px;
      box-shadow: var(--shadow-glass);
    }

    /* ================================================================
       分页 — 独立毛玻璃
       ================================================================ */
    .docsify-pagination-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 24px;
      margin-top: 36px;
      border-top: 1px solid var(--border-glass);
    }

    .pagination-item {
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      padding: 8px 20px;
      transition: all var(--transition);
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pagination-item:hover {
      background: var(--bg-glass-hover);
      border-color: var(--red);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glass);
    }

    .pagination-item .pagination-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    .pagination-item .pagination-title {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ================================================================
       移动端侧边栏切换按钮
       ================================================================ */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 101;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-glass);
      transition: all var(--transition);
    }

    .sidebar-toggle:hover {
      background: var(--bg-glass-hover);
      transform: scale(1.05);
    }

    /* ================================================================
       主题切换按钮
       ================================================================ */
    .theme-toggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 200;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border-glass);
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-glass);
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      user-select: none;
    }

    .theme-toggle:hover {
      transform: scale(1.08) rotate(8deg);
      border-color: var(--red);
      color: var(--red);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .theme-toggle:active {
      transform: scale(0.92);
    }

    /* ================================================================
       封面页（coverpage）兼容
       ================================================================ */
    .cover {
      background: var(--bg-glass) !important;
      backdrop-filter: blur(24px) saturate(1.6) !important;
      -webkit-backdrop-filter: blur(24px) saturate(1.6) !important;
      border: 1px solid var(--border-glass) !important;
      border-radius: var(--radius) !important;
      padding: 60px 40px !important;
      margin: 20px !important;
      box-shadow: var(--shadow-glass) !important;
      text-align: center !important;
      min-height: auto !important;
    }

    .cover h1,
    .cover h2,
    .cover p,
    .cover a,
    .cover .btn {
      color: var(--text-primary) !important;
    }

    .cover .btn {
      background: var(--red) !important;
      border: none !important;
      border-radius: var(--radius-sm) !important;
      padding: 10px 28px !important;
      color: #fff !important;
      font-weight: 600 !important;
      transition: all var(--transition) !important;
      box-shadow: 0 4px 16px var(--red-glow) !important;
    }

    .cover .btn:hover {
      background: var(--red-dark) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--red-glow) !important;
    }

    /* ================================================================
       提示块（flexible alerts）
       ================================================================ */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .danger,
    .markdown-section .warning {
      background: var(--bg-glass) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border-left: 4px solid var(--red) !important;
      color: var(--text-secondary) !important;
      padding: 16px 20px !important;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
      margin: 16px 0 !important;
    }

    /* ================================================================
       响应式
       ================================================================ */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-120%);
        top: 10px;
        left: 10px;
        bottom: 10px;
        width: 280px;
        border-radius: var(--radius);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content {
        margin-left: 0;
        padding: 16px 12px 40px;
      }

      .markdown-section {
        padding: 24px 18px 32px;
        border-radius: 16px;
        margin: 0 4px;
      }

      .markdown-section h1 {
        font-size: 1.6rem;
      }

      .markdown-section h2 {
        font-size: 1.2rem;
      }

      .app-nav {
        padding: 10px 16px;
        gap: 16px;
        border-radius: 14px;
        flex-wrap: wrap;
      }

      .app-nav a {
        font-size: 13px;
      }

      .theme-toggle {
        width: 42px;
        height: 42px;
        font-size: 17px;
        bottom: 16px;
        right: 16px;
      }

      .cover {
        padding: 40px 20px !important;
        margin: 12px !important;
        border-radius: 16px !important;
      }
    }

    @media (max-width: 480px) {
      .markdown-section {
        padding: 18px 12px 24px;
        border-radius: 14px;
      }

      .markdown-section h1 {
        font-size: 1.3rem;
      }

      .app-nav {
        gap: 12px;
        padding: 8px 12px;
      }

      .app-nav a {
        font-size: 12px;
      }
    }

    /* ================================================================
       滚动条（全局）
       ================================================================ */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--red);
      border-radius: 4px;
      opacity: 0.3;
      transition: opacity var(--transition);
    }

    ::-webkit-scrollbar-thumb:hover {
      opacity: 0.8;
    }

    [data-theme="light"] ::-webkit-scrollbar-thumb {
      background: var(--red);
      opacity: 0.2;
    }

    [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
      opacity: 0.5;
    }
  </style>

  <div id="app"></div>

  <!-- ===== 移动端侧边栏开关 ===== -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏">☰</button>

  <!-- ===== 主题切换按钮 ===== -->
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

  <!-- ================================================================
  加载 Docsify 核心与插件
  ================================================================ -->
  <script src="https://unpkg.com/docsify@4.11.3/lib/docsify.min.js">
  </script>
  <script src="https://unpkg.com/docsify-plugin-search@2.0.0/dist/search.min.js">
  </script>
  <script src="https://unpkg.com/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js">
  </script>
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts@1.1.0/docsify-plugin-flexible-alerts.min.js">
  </script>

  <!-- ================================================================
  主题切换逻辑（数据驱动，不换 CSS 文件）
  ================================================================ -->
  <script>
    (function() {
      var STORAGE_KEY = 'silence-docs-theme';
      var btn = document.getElementById('themeToggle');

      function setTheme(theme) {
        var isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.style.background = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.55)';
        try {
          localStorage.setItem(STORAGE_KEY, theme);
        } catch (e) {}
      }

      function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      }

      // 恢复存储的主题，或跟随系统
      var saved = localStorage.getItem(STORAGE_KEY);
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (saved) {
        setTheme(saved);
      } else {
        setTheme(prefersDark ? 'dark' : 'light');
      }

      btn.addEventListener('click', toggleTheme);

      // 监听系统主题变化
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (!localStorage.getItem(STORAGE_KEY)) {
            setTheme(e.matches ? 'dark' : 'light');
          }
        });
      } catch (e) {}
    })();
  </script>

  <!-- ================================================================
  移动端侧边栏控制
  ================================================================ -->
  <script>
    (function() {
      var toggleBtn = document.getElementById('sidebarToggle');
      var sidebar = document.querySelector('.sidebar');

      if (toggleBtn && sidebar) {
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          sidebar.classList.toggle('open');
        });

        // 点击文档主体时关闭侧边栏（移动端）
        document.addEventListener('click', function(e) {
          if (window.innerWidth <= 768) {
            var target = e.target;
            if (!sidebar.contains(target) && target !== toggleBtn && !toggleBtn.contains(target)) {
              sidebar.classList.remove('open');
            }
          }
        });

        // 窗口大小变化时，如果变宽则关闭侧边栏
        window.addEventListener('resize', function() {
          if (window.innerWidth > 768) {
            sidebar.classList.remove('open');
          }
        });
      }
    })();
  </script>

  Service Worker（PWA）

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
