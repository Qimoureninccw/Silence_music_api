<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网易云音乐 API Enhanced · 文档</title>
    <link rel="icon" href="netease.png" />
    <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css" />

    <style>
        /* ============================================================
                   高级毛玻璃文档样式 — 与首页设计统一
                   ============================================================ */

        /* ----- 变量 ----- */
        :root {
            --red: #ec4141;
            --red-dark: #c23333;
            --red-light: rgba(236, 65, 65, 0.15);
            --red-glow: rgba(236, 65, 65, 0.20);

            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.20);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);

            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #7a7a9a;

            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }

        /* ----- 背景图（固定） ----- */
        body {
            background-image: url('/bg1.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-primary);
            line-height: 1.7;
            /* 确保 body 本身没有模糊，性能最优 */
        }

        /* ============================================================
                   侧边栏 — 毛玻璃
                   ============================================================ */
        .sidebar {
            background: rgba(255, 255, 255, 0.70) !important;
            backdrop-filter: blur(24px) saturate(1.4) !important;
            -webkit-backdrop-filter: blur(24px) saturate(1.4) !important;
            border-right: 1px solid var(--glass-border) !important;
            box-shadow: 2px 0 32px rgba(0, 0, 0, 0.04) !important;
            padding-top: 24px !important;
        }

        .app-name-link {
            color: var(--red) !important;
            font-weight: 700 !important;
            font-size: 18px !important;
            letter-spacing: -0.3px !important;
            padding: 0 20px 18px !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04) !important;
            display: block !important;
        }

        .app-name-link img {
            border-radius: 10px !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06) !important;
        }

        .sidebar-nav {
            padding: 12px 14px 20px !important;
        }

        .sidebar-nav ul {
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .sidebar-nav ul li {
            margin: 1px 0 !important;
        }

        .sidebar-nav ul li a {
            display: block !important;
            padding: 7px 14px !important;
            border-radius: var(--radius-sm) !important;
            color: var(--text-secondary) !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            transition: all var(--transition) !important;
            border-left: 3px solid transparent !important;
            text-decoration: none !important;
        }

        .sidebar-nav ul li a:hover {
            background: var(--red-light) !important;
            color: var(--red) !important;
        }

        .sidebar-nav ul li a.active {
            background: var(--red) !important;
            color: #fff !important;
            border-left-color: var(--red-dark) !important;
            box-shadow: 0 2px 16px var(--red-glow) !important;
        }

        /* 侧边栏二级 */
        .sidebar-nav ul ul {
            padding-left: 12px !important;
        }

        .sidebar-nav ul ul li a {
            font-size: 13px !important;
            font-weight: 400 !important;
            color: var(--text-muted) !important;
        }

        .sidebar-nav ul ul li a:hover {
            color: var(--text-primary) !important;
        }

        .sidebar-nav ul ul li a.active {
            background: var(--red) !important;
            color: #fff !important;
        }

        /* ============================================================
                   主内容 — 毛玻璃卡片
                   ============================================================ */
        .content {
            padding-top: 30px !important;
            background: transparent !important;
        }

        .markdown-section {
            max-width: 920px !important;
            margin: 0 auto !important;
            padding: 32px 40px 50px !important;
            background: var(--glass-bg) !important;
            backdrop-filter: blur(24px) saturate(1.4) !important;
            -webkit-backdrop-filter: blur(24px) saturate(1.4) !important;
            border-radius: var(--radius) !important;
            border: 1px solid var(--glass-border) !important;
            box-shadow: var(--glass-shadow) !important;
            color: var(--text-primary) !important;
            transition: box-shadow var(--transition), background var(--transition) !important;
        }

        .markdown-section:hover {
            box-shadow: 0 12px 56px rgba(0, 0, 0, 0.08) !important;
            background: rgba(255, 255, 255, 0.78) !important;
        }

        /* ============================================================
                   排版 — 精致、舒适
                   ============================================================ */
        .markdown-section h1 {
            font-size: 2rem !important;
            font-weight: 700 !important;
            letter-spacing: -0.5px !important;
            border-bottom: 2px solid rgba(0, 0, 0, 0.06) !important;
            padding-bottom: 16px !important;
            margin-bottom: 28px !important;
            color: var(--text-primary) !important;
            position: relative !important;
        }

        .markdown-section h1::after {
            content: '' !important;
            position: absolute !important;
            bottom: -2px !important;
            left: 0 !important;
            width: 48px !important;
            height: 3px !important;
            background: var(--red) !important;
            border-radius: 2px !important;
        }

        .markdown-section h2 {
            font-size: 1.4rem !important;
            font-weight: 600 !important;
            letter-spacing: -0.3px !important;
            margin-top: 42px !important;
            margin-bottom: 14px !important;
            padding-left: 0 !important;
            border-left: none !important;
            color: var(--text-primary) !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04) !important;
            padding-bottom: 8px !important;
        }

        .markdown-section h2:first-of-type {
            margin-top: 0 !important;
        }

        .markdown-section h3 {
            font-size: 1.15rem !important;
            font-weight: 600 !important;
            margin-top: 30px !important;
            margin-bottom: 10px !important;
            color: var(--text-primary) !important;
        }

        .markdown-section h4 {
            font-size: 1rem !important;
            font-weight: 600 !important;
            margin-top: 22px !important;
            color: var(--text-primary) !important;
        }

        .markdown-section p {
            margin: 12px 0 !important;
            color: var(--text-secondary) !important;
            font-size: 15px !important;
        }

        .markdown-section a {
            color: var(--red) !important;
            text-decoration: none !important;
            border-bottom: 1.5px solid transparent !important;
            transition: all var(--transition) !important;
            font-weight: 500 !important;
        }

        .markdown-section a:hover {
            border-bottom-color: var(--red) !important;
            color: var(--red-dark) !important;
        }

        .markdown-section ul,
        .markdown-section ol {
            padding-left: 24px !important;
            margin: 12px 0 !important;
        }

        .markdown-section li {
            margin: 4px 0 !important;
            color: var(--text-secondary) !important;
        }

        .markdown-section blockquote {
            border-left: 4px solid var(--red) !important;
            background: var(--red-light) !important;
            padding: 14px 22px !important;
            margin: 18px 0 !important;
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
            color: var(--text-secondary) !important;
        }

        .markdown-section blockquote p {
            margin: 0 !important;
            color: inherit !important;
        }

        /* ----- 代码 ----- */
        .markdown-section code {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace !important;
            font-size: 0.82em !important;
            background: rgba(236, 65, 65, 0.08) !important;
            color: var(--red-dark) !important;
            padding: 2px 10px !important;
            border-radius: 6px !important;
            font-weight: 500 !important;
        }

        .markdown-section pre {
            background: #0f0f1a !important;
            border-radius: var(--radius-sm) !important;
            padding: 18px 24px !important;
            overflow-x: auto !important;
            margin: 18px 0 !important;
            border: 1px solid rgba(255, 255, 255, 0.04) !important;
        }

        .markdown-section pre code {
            background: transparent !important;
            color: #d4d4e0 !important;
            padding: 0 !important;
            font-size: 0.82rem !important;
            line-height: 1.8 !important;
            font-weight: 400 !important;
        }

        /* ----- 表格 ----- */
        .markdown-section table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 18px 0 !important;
            border-radius: var(--radius-sm) !important;
            overflow: hidden !important;
            font-size: 14px !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        .markdown-section table thead {
            background: var(--red) !important;
            color: #fff !important;
        }

        .markdown-section table th {
            font-weight: 600 !important;
            padding: 12px 18px !important;
            text-align: left !important;
        }

        .markdown-section table td {
            padding: 10px 18px !important;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04) !important;
        }

        .markdown-section table tbody tr:last-child td {
            border-bottom: none !important;
        }

        .markdown-section table tbody tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.02) !important;
        }

        .markdown-section table tbody tr:hover {
            background: rgba(0, 0, 0, 0.03) !important;
        }

        /* ----- 图片 ----- */
        .markdown-section img {
            max-width: 100% !important;
            border-radius: var(--radius-sm) !important;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04) !important;
        }

        /* ----- 分割线 ----- */
        .markdown-section hr {
            border: none !important;
            border-top: 2px solid rgba(0, 0, 0, 0.04) !important;
            margin: 36px 0 !important;
        }

        /* ============================================================
                   顶部导航 — 毛玻璃
                   ============================================================ */
        .app-nav {
            background: rgba(255, 255, 255, 0.50) !important;
            backdrop-filter: blur(16px) saturate(1.4) !important;
            -webkit-backdrop-filter: blur(16px) saturate(1.4) !important;
            border-bottom: 1px solid var(--glass-border) !important;
            padding: 12px 24px !important;
            display: flex !important;
            gap: 28px !important;
            align-items: center !important;
        }

        .app-nav a {
            color: var(--text-secondary) !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            padding: 4px 0 !important;
            border-bottom: 2px solid transparent !important;
            transition: all var(--transition) !important;
            text-decoration: none !important;
        }

        .app-nav a:hover {
            color: var(--text-primary) !important;
            border-bottom-color: var(--red) !important;
        }

        .app-nav a::before {
            display: none !important;
        }

        /* ============================================================
                   分页
                   ============================================================ */
        .docsify-pagination-container {
            border-top: 1px solid rgba(0, 0, 0, 0.04) !important;
            padding-top: 24px !important;
            margin-top: 36px !important;
            display: flex !important;
            justify-content: space-between !important;
            gap: 16px !important;
        }

        .pagination-item {
            border: 1px solid rgba(0, 0, 0, 0.04) !important;
            border-radius: var(--radius-sm) !important;
            padding: 8px 20px !important;
            transition: all var(--transition) !important;
            background: transparent !important;
        }

        .pagination-item:hover {
            background: var(--red-light) !important;
            border-color: var(--red) !important;
            transform: translateY(-1px) !important;
        }

        .pagination-item .pagination-label {
            color: var(--text-muted) !important;
            font-size: 12px !important;
            font-weight: 500 !important;
        }

        .pagination-item .pagination-title {
            color: var(--text-primary) !important;
            font-weight: 500 !important;
        }

        /* ============================================================
                   搜索框 — 毛玻璃
                   ============================================================ */
        .search .input-wrap input {
            border-radius: var(--radius-sm) !important;
            border: 1px solid rgba(0, 0, 0, 0.04) !important;
            padding: 8px 16px 8px 38px !important;
            font-family: inherit !important;
            font-size: 14px !important;
            transition: all var(--transition) !important;
            background: rgba(255, 255, 255, 0.60) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
        }

        .search .input-wrap input:focus {
            border-color: var(--red) !important;
            box-shadow: 0 0 0 3px var(--red-glow) !important;
            outline: none !important;
        }

        .search .input-wrap .search-icon {
            color: var(--text-muted) !important;
        }

        /* ============================================================
                   移动端菜单按钮
                   ============================================================ */
        .sidebar-toggle {
            background: rgba(255, 255, 255, 0.70) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: var(--radius-sm) !important;
            box-shadow: var(--glass-shadow) !important;
            transition: all var(--transition) !important;
            width: 42px !important;
            height: 42px !important;
            font-size: 20px !important;
        }

        .sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.90) !important;
            transform: scale(1.04) !important;
        }

        /* ============================================================
                   主题切换按钮
                   ============================================================ */
        .theme-toggle {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 200;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--glass-shadow);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            border-color: var(--red);
            color: var(--red);
        }

        .theme-toggle.light-mode {
            background: rgba(255, 255, 255, 0.85);
        }

        /* ============================================================
                   深色模式
                   ============================================================ */
        body.dark {
            --glass-bg: rgba(28, 28, 44, 0.75);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.30);
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --text-muted: #6a6a88;
            --red-light: rgba(229, 72, 77, 0.15);
        }

        body.dark .sidebar {
            background: rgba(18, 18, 30, 0.80) !important;
            border-right-color: var(--glass-border) !important;
        }

        body.dark .sidebar-nav ul li a {
            color: var(--text-secondary) !important;
        }

        body.dark .sidebar-nav ul li a:hover {
            background: var(--red-light) !important;
            color: var(--red) !important;
        }

        body.dark .sidebar-nav ul li a.active {
            background: var(--red) !important;
            color: #fff !important;
        }

        body.dark .markdown-section {
            color: var(--text-primary) !important;
        }

        body.dark .markdown-section:hover {
            background: rgba(28, 28, 44, 0.85) !important;
        }

        body.dark .markdown-section h1,
        body.dark .markdown-section h2,
        body.dark .markdown-section h3,
        body.dark .markdown-section h4 {
            color: var(--text-primary) !important;
        }

        body.dark .markdown-section p,
        body.dark .markdown-section li {
            color: var(--text-secondary) !important;
        }

        body.dark .markdown-section code {
            background: rgba(236, 65, 65, 0.18) !important;
            color: #f0a0a0 !important;
        }

        body.dark .markdown-section pre {
            background: #0a0a14 !important;
        }

        body.dark .markdown-section blockquote {
            background: rgba(236, 65, 65, 0.08) !important;
        }

        body.dark .markdown-section table tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02) !important;
        }

        body.dark .markdown-section table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04) !important;
        }

        body.dark .app-nav {
            background: rgba(18, 18, 30, 0.50) !important;
            border-bottom-color: var(--glass-border) !important;
        }

        body.dark .app-nav a {
            color: var(--text-secondary) !important;
        }

        body.dark .app-nav a:hover {
            color: var(--text-primary) !important;
        }

        body.dark .search .input-wrap input {
            background: rgba(28, 28, 44, 0.60) !important;
            border-color: var(--glass-border) !important;
            color: var(--text-primary) !important;
        }

        body.dark .pagination-item {
            border-color: var(--glass-border) !important;
        }

        body.dark .pagination-item:hover {
            background: var(--red-light) !important;
        }

        body.dark .docsify-pagination-container {
            border-top-color: var(--glass-border) !important;
        }

        body.dark .sidebar-toggle {
            background: rgba(28, 28, 44, 0.70) !important;
            border-color: var(--glass-border) !important;
            color: var(--text-secondary) !important;
        }

        body.dark .theme-toggle {
            background: rgba(28, 28, 44, 0.75);
            border-color: var(--glass-border);
            color: var(--text-secondary);
        }

        body.dark .theme-toggle:hover {
            border-color: var(--red);
            color: var(--red);
        }

        /* ============================================================
                   滚动条
                   ============================================================ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 4px;
            opacity: 0.3;
            transition: opacity var(--transition);
        }
        ::-webkit-scrollbar-thumb:hover {
            opacity: 0.8;
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 768px) {
            .markdown-section {
                padding: 20px 18px 32px !important;
                border-radius: 14px !important;
                margin: 0 8px !important;
            }

            .markdown-section h1 {
                font-size: 1.6rem !important;
            }

            .markdown-section h2 {
                font-size: 1.2rem !important;
            }

            .content {
                padding-top: 16px !important;
            }

            .app-nav {
                padding: 10px 16px !important;
                gap: 18px !important;
            }

            .app-nav a {
                font-size: 13px !important;
            }

            .sidebar {
                background: rgba(255, 255, 255, 0.85) !important;
                backdrop-filter: blur(28px) saturate(1.6) !important;
                -webkit-backdrop-filter: blur(28px) saturate(1.6) !important;
            }

            .theme-toggle {
                width: 40px;
                height: 40px;
                font-size: 17px;
                bottom: 16px;
                right: 16px;
            }
        }

        @media (max-width: 480px) {
            .markdown-section {
                padding: 16px 12px 24px !important;
                border-radius: 12px !important;
                margin: 0 4px !important;
            }

            .markdown-section h1 {
                font-size: 1.3rem !important;
            }
        }
    </style>
</head>

    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

    <!-- ============================================================
    Docsify 配置
    ============================================================ -->

        window.$docsify = {
            name: '网易云音乐 API Enhanced',
            repo: 'https://github.com/neteasecloudmusicapienhanced/api-enhanced',
            coverpage: false,

                { title: '文档', path: '/home' },
                { title: 'GitHub', path: 'https://github.com/neteasecloudmusicapienhanced/api-enhanced' }
            ]
        };

    <!-- ============================================================
    加载 Docsify 及插件
    ============================================================ -->
    <script src="https://unpkg.com/docsify@4.11.3/lib/docsify.min.js">
    </script>
    <script src="https://unpkg.com/docsify-plugin-search@2.0.0/dist/search.min.js">
    </script>
    <script src="https://unpkg.com/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js">
    </script>
    <script src="https://unpkg.com/docsify-plugin-flexible-alerts@1.1.0/docsify-plugin-flexible-alerts.min.js">
    </script>

    <!-- ============================================================
    主题切换逻辑
    ============================================================ -->
    <script>
        (function() {
            var STORAGE_KEY = 'docsify-theme';
            var btn = document.getElementById('themeToggle');

            function setTheme(theme) {
                var isDark = (theme === 'dark');
                document.body.classList.toggle('dark', isDark);
                btn.textContent = isDark ? '☀️' : '🌙';
                btn.className = 'theme-toggle' + (isDark ? '' : ' light-mode');
                try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
            }

            function toggleTheme() {
                var isDark = document.body.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            }

            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                setTheme(saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            }

            btn.addEventListener('click', toggleTheme);

            try {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                    if (!localStorage.getItem(STORAGE_KEY)) {
                        setTheme(e.matches ? 'dark' : 'light');
                    }
                });
            } catch (e) {}
        })();
    </script>
