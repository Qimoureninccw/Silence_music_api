<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="keywords" content="网易云音乐api文档">
  <meta name="description" content="网易云音乐API">
  <title>Silence的网易云音乐API 使用文档</title>
  <link rel="icon" href="netease.png">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="referrer" content="never">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/dark.css" id="theme-css">
  <style>
    /* ================================================================
       背景图（固定）
       ================================================================ */
    body {
      background-image: url('/bg1.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #fff;
      line-height: 1.7;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      position: relative;
    }

    /* 背景遮罩 — 让背景图更柔和 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* 所有内容在遮罩之上 */
    #app,
    .sidebar,
    .content,
    .app-nav,
    .cover {
      position: relative;
      z-index: 1;
    }

    /* ================================================================
       滚动条 — 隐藏（干净）
       ================================================================ */
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }


    .sidebar {
      background: rgba(255, 255, 255, 0.06) !important;
      backdrop-filter: blur(24px) saturate(1.4) !important;
      -webkit-backdrop-filter: blur(24px) saturate(1.4) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 0 20px 20px 0 !important;
      margin: 16px 0 16px 0 !important;
      height: calc(100% - 32px) !important;
      top: 16px !important;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
      padding-top: 20px !important;
      width: 280px !important;
    }

    .app-name-link {
      color: #fff !important;
      font-weight: 700 !important;
      font-size: 17px !important;
      letter-spacing: -0.3px !important;
      padding: 0 20px 18px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
      display: block !important;
      opacity: 0.95;
    }
    .app-name-link img {
      border-radius: 10px !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3) !important;
    }

    .sidebar-nav {
      padding: 12px 14px 20px !important;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
    }

    .sidebar-nav ul {
      list-style: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .sidebar-nav ul li {
      margin: 2px 0 !important;
    }

    .sidebar-nav ul li a {
      display: block !important;
      padding: 7px 14px !important;
      border-radius: 10px !important;
      color: rgba(255, 255, 255, 0.6) !important;
      font-weight: 500 !important;
      font-size: 14px !important;
      transition: all 0.25s ease !important;
      border-left: 2px solid transparent !important;
      text-decoration: none !important;
    }

    .sidebar-nav ul li a:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #fff !important;
    }

    .sidebar-nav ul li a.active {
      background: rgba(255, 255, 255, 0.10) !important;
      color: #fff !important;
      border-left-color: rgba(255, 255, 255, 0.3) !important;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.02) !important;
    }

    /* 侧边栏二级 */
    .sidebar-nav ul ul {
      padding-left: 12px !important;
    }
    .sidebar-nav ul ul li a {
      font-size: 13px !important;
      font-weight: 400 !important;
      color: rgba(255, 255, 255, 0.45) !important;
    }
    .sidebar-nav ul ul li a:hover {
      color: rgba(255, 255, 255, 0.8) !important;
    }
    .sidebar-nav ul ul li a.active {
      color: #fff !important;
      background: rgba(255, 255, 255, 0.06) !important;
    }

    /* ================================================================
       移动端侧边栏切换按钮
       ================================================================ */
    .sidebar-toggle {
      display: none !important;
    }

    /* ================================================================
       主内容 — 独立毛玻璃卡片
       ================================================================ */
    .content {
      padding-top: 20px !important;
      position: relative;
      z-index: 1;
    }

    .markdown-section {
      background: rgba(255, 255, 255, 0.06) !important;
      backdrop-filter: blur(24px) saturate(1.4) !important;
      -webkit-backdrop-filter: blur(24px) saturate(1.4) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 20px !important;
      padding: 32px 40px !important;
      margin: 24px auto !important;
      max-width: 920px !important;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
      color: rgba(255, 255, 255, 0.92) !important;
      transition: box-shadow 0.3s ease, background 0.3s ease;
    }

    .markdown-section:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      box-shadow: 0 12px 56px rgba(0, 0, 0, 0.4) !important;
    }

    /* ================================================================
       排版
       ================================================================ */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: #fff !important;
      font-weight: 600 !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding-bottom: 10px !important;
      margin-top: 28px !important;
      margin-bottom: 16px !important;
    }

    .markdown-section h1:first-child,
    .markdown-section h2:first-child {
      margin-top: 0 !important;
    }

    .markdown-section p,
    .markdown-section li,
    .markdown-section td {
      color: rgba(255, 255, 255, 0.82) !important;
      line-height: 1.8 !important;
    }

    .markdown-section a {
      color: #fff !important;
      text-decoration: none !important;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.3) !important;
      transition: all 0.2s ease !important;
      padding-bottom: 1px !important;
    }

    .markdown-section a:hover {
      border-bottom-color: #fff !important;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.2) !important;
    }

    .markdown-section strong {
      color: #fff !important;
      font-weight: 600 !important;
    }

    /* ----- 代码 ----- */
    .markdown-section code,
    .markdown-section p code,
    .markdown-section li code,
    .markdown-section td code {
      background: rgba(0, 0, 0, 0.45) !important;
      color: #f0f0f0 !important;
      padding: 3px 10px !important;
      border-radius: 6px !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      font-size: 0.88em !important;
      font-family: 'SF Mono', 'Courier New', Consolas, monospace !important;
      white-space: pre-wrap !important;
      word-break: break-all !important;
    }

    .markdown-section pre {
      background: rgba(0, 0, 0, 0.40) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 12px !important;
      padding: 18px 22px !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2) !important;
    }

    .markdown-section pre code {
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
      color: #e8e8e8 !important;
    }

    /* ----- 表格 ----- */
    .markdown-section table {
      background: rgba(255, 255, 255, 0.03) !important;
      border-collapse: collapse !important;
      width: 100% !important;
      border-radius: 12px !important;
      overflow: hidden !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2) !important;
    }

    .markdown-section th {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #fff !important;
      padding: 12px 18px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      font-weight: 600 !important;
    }

    .markdown-section td {
      padding: 10px 18px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04) !important;
    }

    .markdown-section tr:last-child td {
      border-bottom: none !important;
    }

    .markdown-section table tbody tr:hover {
      background: rgba(255, 255, 255, 0.04) !important;
    }

    /* ----- 引用块 ----- */
    .markdown-section blockquote {
      background: rgba(255, 255, 255, 0.04) !important;
      border-left: 4px solid rgba(255, 255, 255, 0.2) !important;
      padding: 14px 22px !important;
      border-radius: 0 10px 10px 0 !important;
      color: rgba(255, 255, 255, 0.7) !important;
      margin: 18px 0 !important;
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
    }

    .markdown-section blockquote p {
      margin: 0 !important;
      color: inherit !important;
    }

    /* ----- 分割线 ----- */
    .markdown-section hr {
      border: 0 !important;
      height: 1px !important;
      background: rgba(255, 255, 255, 0.06) !important;
      margin: 32px 0 !important;
    }

    /* ----- 图片 ----- */
    .markdown-section img {
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3) !important;
      max-width: 100% !important;
      height: auto !important;
    }

    /* ================================================================
       顶部导航 — 独立毛玻璃卡片
       ================================================================ */
    .app-nav {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(20px) saturate(1.4) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.4) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
      padding: 12px 24px !important;
      margin: 12px 16px 0 16px !important;
      border-radius: 16px !important;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.04) !important;
      display: flex !important;
      gap: 28px !important;
      align-items: center !important;
    }

    .app-nav a {
      color: rgba(255, 255, 255, 0.6) !important;
      font-weight: 500 !important;
      font-size: 14px !important;
      padding: 4px 0 !important;
      border-bottom: 2px solid transparent !important;
      transition: all 0.25s ease !important;
      text-decoration: none !important;
    }

    .app-nav a:hover {
      color: #fff !important;
      border-bottom-color: rgba(255, 255, 255, 0.3) !important;
    }

    .app-nav a::before {
      display: none !important;
    }

    /* ================================================================
       搜索框 — 独立毛玻璃
       ================================================================ */
    .search .input-wrap input {
      background: rgba(255, 255, 255, 0.06) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 12px !important;
      padding: 8px 16px 8px 38px !important;
      color: #fff !important;
      font-size: 14px !important;
      transition: all 0.25s ease !important;
    }

    .search .input-wrap input::placeholder {
      color: rgba(255, 255, 255, 0.3) !important;
    }

    .search .input-wrap input:focus {
      border-color: rgba(255, 255, 255, 0.2) !important;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04) !important;
      outline: none !important;
    }

    .search .input-wrap .search-icon {
      color: rgba(255, 255, 255, 0.2) !important;
    }

    .results-panel {
      background: rgba(20, 20, 32, 0.85) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    /* ================================================================
       分页 — 独立毛玻璃
       ================================================================ */
    .docsify-pagination-container {
      border-top: 1px solid rgba(255, 255, 255, 0.06) !important;
      margin-top: 32px !important;
      padding-top: 20px !important;
      display: flex !important;
      justify-content: space-between !important;
      gap: 16px !important;
    }

    .pagination-item {
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 12px !important;
      padding: 8px 20px !important;
      transition: all 0.25s ease !important;
      background: rgba(255, 255, 255, 0.03) !important;
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
    }

    .pagination-item:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      transform: translateY(-2px) !important;
    }

    .pagination-item .pagination-label {
      color: rgba(255, 255, 255, 0.3) !important;
      font-size: 12px !important;
      font-weight: 500 !important;
    }

    .pagination-item .pagination-title {
      color: rgba(255, 255, 255, 0.8) !important;
      font-weight: 500 !important;
    }

    /* ================================================================
       封面页（coverpage）兼容
       ================================================================ */
    .cover {
      background: rgba(0, 0, 0, 0.3) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-radius: 20px !important;
      margin: 20px !important;
      padding: 60px 40px !important;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .cover h1,
    .cover h2,
    .cover p,
    .cover a,
    .cover .btn {
      color: #fff !important;
    }

    .cover .btn {
      background: rgba(255, 255, 255, 0.10) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border: 1px solid rgba(255, 255, 255, 0.10) !important;
      color: #fff !important;
      border-radius: 12px !important;
      padding: 10px 28px !important;
      transition: all 0.25s ease !important;
    }

    .cover .btn:hover {
      background: rgba(255, 255, 255, 0.18) !important;
    }

    /* ================================================================
       深色模式下 docsify 默认覆盖
       ================================================================ */
    .markdown-section .tip,
    .markdown-section .warn,
    .markdown-section .danger,
    .markdown-section .warning {
      background: rgba(255, 255, 255, 0.04) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border-left: 4px solid rgba(255, 255, 255, 0.15) !important;
      color: #fff !important;
      padding: 16px 20px !important;
      border-radius: 10px !important;
      margin: 16px 0 !important;
    }

    /* ================================================================
       响应式
       ================================================================ */
    @media (max-width: 768px) {
      .sidebar {
        border-radius: 0 16px 16px 0 !important;
        margin: 8px 0 8px 0 !important;
        height: calc(100% - 16px) !important;
        top: 8px !important;
        width: 260px !important;
      }

      .markdown-section {
        padding: 20px 18px 28px !important;
        border-radius: 16px !important;
        margin: 16px 12px !important;
      }

      .app-nav {
        margin: 8px 12px 0 12px !important;
        padding: 10px 16px !important;
        gap: 18px !important;
        border-radius: 14px !important;
        flex-wrap: wrap !important;
      }

      .app-nav a {
        font-size: 13px !important;
      }

      .markdown-section h1 {
        font-size: 1.5rem !important;
      }
      .markdown-section h2 {
        font-size: 1.2rem !important;
      }

      .cover {
        margin: 12px !important;
        padding: 40px 20px !important;
        border-radius: 16px !important;
      }
    }

    @media (max-width: 480px) {
      .markdown-section {
        padding: 16px 12px 24px !important;
        border-radius: 14px !important;
        margin: 12px 8px !important;
      }

      .app-nav {
        margin: 6px 8px 0 8px !important;
        padding: 8px 12px !important;
        gap: 12px !important;
        border-radius: 12px !important;
      }

      .app-nav a {
        font-size: 12px !important;
      }

      .markdown-section h1 {
        font-size: 1.25rem !important;
      }
    }
  </style>
