<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="keywords" content="网易云音乐,网易云音乐 api,网易云音乐 nodejs,网易云音乐 node.js">
  <meta name="description" content="SilenceMusicAPI - 网易云音乐 NodeJS API Enhanced">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="referrer" content="never">
  <title>SilenceMusicAPI</title>

  <!-- 静态资源 baseURL：改这里即可（CDN / 子路径都行） -->
  <base href="/">

  <link rel="icon" href="netease.png">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css" id="theme-css">

  <style>
    /* ============ 设计令牌 ============ */
    :root {
      --red: #ec4141;
      --red-soft: rgba(236, 65, 65, 0.12);

      --bg-overlay: rgba(10, 10, 18, 0.55);
      --glass: rgba(255, 255, 255, 0.10);
      --glass-strong: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-hover: rgba(255, 255, 255, 0.16);

      --fg: #f2f2f7;
      --fg-muted: rgba(242, 242, 247, 0.72);
      --fg-dim: rgba(242, 242, 247, 0.45);
      --line: rgba(255, 255, 255, 0.10);

      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.38);
      --blur: 22px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.theme-light {
      --bg-overlay: rgba(245, 245, 250, 0.55);
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(0, 0, 0, 0.06);
      --glass-hover: rgba(255, 255, 255, 0.95);

      --fg: #1a1a2e;
      --fg-muted: rgba(26, 26, 46, 0.72);
      --fg-dim: rgba(26, 26, 46, 0.45);
      --line: rgba(0, 0, 0, 0.06);

      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.12);
    }

    /* ============ 背景视频 ============ */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }
    #bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--bg-overlay);
      pointer-events: none;
      transition: background 0.3s var(--ease);
    }

    html, body {
      background: transparent !important;
      color: var(--fg) !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============ 侧边栏 ============ */
    .sidebar {
      background: var(--glass) !important;
      backdrop-filter: blur(var(--blur)) saturate(160%) !important;
      -webkit-backdrop-filter: blur(var(--blur)) saturate(160%) !important;
      border-right: 1px solid var(--glass-border) !important;
      color: var(--fg) !important;
      padding-top: 24px !important;
      box-shadow: var(--shadow);
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    /* 站点名 */
    .sidebar .app-name {
      margin: 0 0 8px 0 !important;
      padding: 0 22px 16px !important;
      border-bottom: 1px solid var(--line);
      font-size: 17px !important;
      line-height: 1.3;
    }
    .sidebar .app-name-link {
      color: var(--fg) !important;
      font-weight: 700 !important;
      font-size: 17px !important;
      letter-spacing: -0.2px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar .app-name-link::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
      flex-shrink: 0;
    }

    /* 导航区 */
    .sidebar .sidebar-nav {
      padding: 8px 12px 20px !important;
    }
    .sidebar .sidebar-nav ul {
      margin: 0 !important;
      padding: 0 !important;
      list-style: none;
    }
    .sidebar .sidebar-nav ul ul {
      padding-left: 10px !important;
      margin: 2px 0 6px !important;
    }

    .sidebar .sidebar-nav li {
      margin: 1px 0 !important;
      list-style: none;
    }

    /* 链接 */
    .sidebar .sidebar-nav a {
      color: var(--fg-muted) !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      padding: 7px 12px !important;
      border-radius: var(--radius-sm) !important;
      transition: all 0.18s var(--ease) !important;
      display: block;
      border: none !important;
      text-decoration: none !important;
      line-height: 1.5;
    }
    .sidebar .sidebar-nav a:hover {
      color: var(--fg) !important;
      background: var(--glass-hover) !important;
      transform: translateX(2px);
    }

    /* 激活项 */
    .sidebar .sidebar-nav li.active > a,
    .sidebar .sidebar-nav li.active > a:hover {
      color: #fff !important;
      background: var(--red) !important;
      box-shadow: 0 4px 16px rgba(236, 65, 65, 0.4);
      transform: none;
    }

    /* 分组标题（_sidebar.md 里的 ## 标题） */
    .sidebar .sidebar-nav li > p {
      font-weight: 600 !important;
      font-size: 12px !important;
      color: var(--fg-dim) !important;
      letter-spacing: 0.6px;
      padding: 12px 12px 6px !important;
      margin: 0 !important;
    }

    /* ============ 主内容区 ============ */
    .content {
      background: transparent !important;
      padding-top: 0 !important;
    }

    .markdown-section {
      background: var(--glass) !important;
      backdrop-filter: blur(var(--blur)) saturate(160%) !important;
      -webkit-backdrop-filter: blur(var(--blur)) saturate(160%) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow-lg) !important;
      color: var(--fg) !important;
      max-width: 920px !important;
      margin: 32px auto 60px !important;
      padding: 40px 48px !important;
      line-height: 1.75 !important;
      font-size: 15px !important;
      transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      color: var(--fg) !important;
      font-weight: 700 !important;
      letter-spacing: -0.3px;
      border-bottom-color: var(--line) !important;
      margin-top: 1.6em;
    }
    .markdown-section h1 { font-size: 2em !important; }
    .markdown-section h2 {
      font-size: 1.5em !important;
      padding-bottom: 0.4em;
      border-bottom: 1px solid var(--line) !important;
    }

    .markdown-section a {
      color: var(--red) !important;
      text-decoration: none !important;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s var(--ease);
    }
    .markdown-section a:hover { border-bottom-color: var(--red); }

    .markdown-section p,
    .markdown-section li { color: var(--fg-muted) !important; }

    .markdown-section code {
      background: rgba(255, 255, 255, 0.08) !important;
      color: var(--red) !important;
      padding: 2px 7px !important;
      border-radius: 6px !important;
      font-size: 0.88em !important;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace !important;
      border: 1px solid var(--line);
    }
    body.theme-light .markdown-section code {
      background: rgba(0, 0, 0, 0.05) !important;
    }

    .markdown-section pre {
      background: rgba(0, 0, 0, 0.35) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      padding: 18px 20px !important;
    }
    body.theme-light .markdown-section pre {
      background: rgba(28, 28, 40, 0.92) !important;
    }
    .markdown-section pre code {
      background: transparent !important;
      border: none !important;
      color: #e8e8f0 !important;
      padding: 0 !important;
      font-size: 13px !important;
    }

    .markdown-section blockquote {
      border-left: 3px solid var(--red) !important;
      background: var(--red-soft) !important;
      color: var(--fg-muted) !important;
      padding: 12px 18px !important;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0 !important;
      margin: 1.2em 0 !important;
    }

    .markdown-section table {
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm);
      overflow: hidden;
      width: 100%;
    }
    .markdown-section table th {
      background: var(--glass-strong) !important;
      color: var(--fg) !important;
      font-weight: 600;
      padding: 10px 14px !important;
      border: none !important;
      border-bottom: 1px solid var(--line) !important;
    }
    .markdown-section table td {
      padding: 10px 14px !important;
      border: none !important;
      border-bottom: 1px solid var(--line) !important;
      color: var(--fg-muted) !important;
    }
    .markdown-section table tr:last-child td { border-bottom: none !important; }

    .markdown-section hr {
      border: none;
      height: 1px;
      background: var(--line);
      margin: 2em 0;
    }

    /* ============ 搜索框 ============ */
    .sidebar .search {
      margin: 12px 16px !important;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--line) !important;
      background: var(--glass-strong) !important;
    }
    .sidebar .search input {
      background: transparent !important;
      color: var(--fg) !important;
      padding: 12px 16px !important;
      font-size: 14px !important;
      border: none !important;
      outline: none !important;
      width: 100%;
    }
    .sidebar .search input::placeholder { color: var(--fg-dim) !important; }
    .sidebar .search .results-panel {
      background: var(--glass-strong) !important;
      backdrop-filter: blur(var(--blur));
    }
    .sidebar .search h2 { color: var(--fg-dim) !important; font-size: 12px; }
    .sidebar .search a { color: var(--red) !important; }

    /* ============ 移动端侧边栏切换按钮 ============ */
    .sidebar-toggle {
      background: var(--glass-strong) !important;
      backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border) !important;
      border-radius: var(--radius-sm) !important;
      padding: 8px !important;
    }
    .sidebar-toggle span { background: var(--fg) !important; }

    /* ============ 分页 ============ */
    .docsify-pagination-container {
      border-top: 1px solid var(--line) !important;
      padding-top: 20px !important;
    }
    .pagination-item-label { color: var(--fg-dim) !important; font-size: 12px !important; }
    .pagination-item-title { color: var(--fg) !important; }
    .pagination-item a { color: var(--red) !important; }

    /* ============ 滚动条 ============ */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
    body.theme-light ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.16); }
    body.theme-light ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.28); }

    /* ============ 主题切换按钮 ============ */
    .theme-toggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 999;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      backdrop-filter: blur(var(--blur)) saturate(160%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
      color: var(--fg);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.3s var(--ease);
      outline: none;
      padding: 0;
      line-height: 1;
      user-select: none;
    }
    .theme-toggle:hover {
      transform: scale(1.1) rotate(10deg);
      box-shadow: var(--shadow-lg);
      border-color: var(--red);
    }
    .theme-toggle:active { transform: scale(0.94); }

    /* ============ 移动端 ============ */
    @media (max-width: 768px) {
      .markdown-section {
        margin: 16px 12px 80px !important;
        padding: 24px 20px !important;
        border-radius: 14px !important;
        font-size: 14.5px !important;
      }
      .markdown-section h1 { font-size: 1.6em !important; }
      .sidebar { width: 260px; }
      .theme-toggle { bottom: 20px; right: 20px; width: 44px; height: 44px; }
    }
  </style>

<body class="theme-dark">

  <!-- ===== 背景视频 ===== -->
  <video autoplay muted loop playsinline id="bg-video" poster="bg_fufu_1080.png">
    <source src="bg_fufu_1080.mp4" type="video/mp4">
    <img src="bg1.webp" alt="背景" style="position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:-2;pointer-events:none;">
  </video>
  <div id="bg-overlay"></div>

  <div id="app"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>

  <script>
    (function () {
      var STORAGE_KEY = 'docsify-theme';
      var body = document.body;
      var btn = document.getElementById('themeToggle');
      var link = document.getElementById('theme-css');

      var LIGHT_URL = '//unpkg.com/docsify/lib/themes/vue.css';
      var DARK_URL  = '//unpkg.com/docsify/lib/themes/dark.css';

      function apply(theme) {
        body.classList.toggle('theme-dark', theme === 'dark');
        body.classList.toggle('theme-light', theme === 'light');
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        link.href = theme === 'dark' ? DARK_URL : LIGHT_URL;
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
      }

      function current() {
        return body.classList.contains('theme-dark') ? 'dark' : 'light';
      }

      btn.addEventListener('click', function () {
        apply(current() === 'dark' ? 'light' : 'dark');
      });

      var saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved === 'light' || saved === 'dark') {
        apply(saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        apply('light');
      } else {
        apply('dark');
      }

      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          if (!localStorage.getItem(STORAGE_KEY)) {
            apply(e.matches ? 'dark' : 'light');
          }
        });
      } catch (e) {}
    })();
  </script>

  <script>
    window.$docsify = {

      loadSidebar: true,
      /* 显示到二级标题（## 会作为分组） */

      /* 侧边栏随页面滚动高亮 */
      auto2top: true,
      /* 侧边栏点击后自动折叠（移动端） */

      search: {
        placeholder: '搜索文档…',
        noData: '没有找到结果',
        paths: 'auto',
        depth: 3,
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制',
      },
    };
  </script>
