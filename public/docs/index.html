<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="keywords" content="网易云音乐,网易云音乐 api,网易云音乐 nodejs,网易云音乐 node.js">
  <meta name="description" content="网易云音乐 NodeJS API Enhanced">
  <title>网易云音乐 NodeJS API Enhanced</title>
  <link rel="icon" href="netease.png">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="referrer" content="never">

  <!-- 不再加载外部主题 CSS，全部自定义 -->
  <style>
    /* ===== 视频背景 ===== */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }
    #bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      pointer-events: none;
      transition: background 0.3s;
    }
    [data-theme="light"] #bg-overlay {
      background: rgba(255, 255, 255, 0.30);
    }

    /* ===== 基础配色（中性灰） ===== */
    :root {
      --text: #f0f0f5;
      --text-secondary: rgba(255,255,255,0.8);
      --text-muted: rgba(255,255,255,0.5);
      --bg-glass: rgba(255,255,255,0.06);
      --bg-glass-hover: rgba(255,255,255,0.10);
      --bg-sidebar: rgba(20,20,32,0.55);
      --border-glass: rgba(255,255,255,0.06);
      --shadow: 0 8px 40px rgba(0,0,0,0.15);
      --code-bg: rgba(0,0,0,0.35);
    }
    [data-theme="light"] {
      --text: #1a1a2e;
      --text-secondary: rgba(26,26,46,0.8);
      --text-muted: rgba(26,26,46,0.5);
      --bg-glass: rgba(255,255,255,0.50);
      --bg-glass-hover: rgba(255,255,255,0.65);
      --bg-sidebar: rgba(255,255,255,0.50);
      --border-glass: rgba(0,0,0,0.04);
      --shadow: 0 8px 40px rgba(0,0,0,0.04);
      --code-bg: rgba(0,0,0,0.05);
    }

    /* ===== 全局 ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a12;
      color: var(--text);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }
    [data-theme="light"] body { background: #f0f2f6; }

    /* ===== 主题切换按钮（沿用原样式，适配深色/浅色） ===== */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-glass);
      background: var(--bg-sidebar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      outline: none;
      padding: 0;
      user-select: none;
    }
    .theme-toggle:hover {
      transform: scale(1.12) rotate(12deg);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .theme-toggle:active { transform: scale(0.92); }

    /* ===== 侧边栏（毛玻璃） ===== */
    .sidebar {
      background: var(--bg-sidebar) !important;
      backdrop-filter: blur(20px) saturate(1.4) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.4) !important;
      border-right: 1px solid var(--border-glass) !important;
      box-shadow: 4px 0 32px rgba(0,0,0,0.1) !important;
    }
    .app-name-link {
      color: var(--text) !important;
      font-weight: 700 !important;
    }
    .sidebar-nav ul li a {
      color: var(--text-muted) !important;
      border-radius: 6px !important;
      padding: 5px 12px !important;
      margin: 2px 0 !important;
      transition: all 0.2s !important;
      border-left: 3px solid transparent !important;
      font-weight: 500;
    }
    .sidebar-nav ul li a:hover {
      background: var(--bg-glass) !important;
      color: var(--text) !important;
    }
    .sidebar-nav ul li a.active {
      background: var(--bg-glass-hover) !important;
      color: var(--text) !important;
      border-left-color: var(--text-muted) !important;
    }

    /* ===== 主内容（毛玻璃卡片） ===== */
    .content { padding-top: 30px !important; background: transparent !important; }
    .markdown-section {
      max-width: 920px !important;
      margin: 0 auto !important;
      padding: 32px 40px 50px !important;
      background: var(--bg-glass) !important;
      backdrop-filter: blur(20px) saturate(1.4) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.4) !important;
      border-radius: 20px !important;
      border: 1px solid var(--border-glass) !important;
      box-shadow: var(--shadow) !important;
      color: var(--text) !important;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .markdown-section:hover {
      background: var(--bg-glass-hover) !important;
    }

    /* ===== 排版（中性灰） ===== */
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: var(--text) !important;
      border-bottom-color: var(--border-glass) !important;
    }
    .markdown-section h1 { border-bottom-width: 2px; padding-bottom: 12px; }
    .markdown-section h2 { border-bottom-width: 1px; padding-bottom: 8px; margin-top: 40px; }
    .markdown-section p, .markdown-section li {
      color: var(--text-secondary) !important;
    }
    .markdown-section a {
      color: var(--text) !important;
      border-bottom: 1.5px solid var(--text-muted) !important;
      font-weight: 600;
      text-decoration: none;
    }
    .markdown-section a:hover {
      border-bottom-color: var(--text) !important;
    }

    /* ===== 代码块（半透明） ===== */
    .markdown-section code {
      background: var(--code-bg) !important;
      color: var(--text-secondary) !important;
      padding: 2px 10px !important;
      border-radius: 6px !important;
      border: 1px solid var(--border-glass) !important;
    }
    .markdown-section pre {
      background: var(--code-bg) !important;
      border-radius: 12px !important;
      padding: 18px 22px !important;
      border: 1px solid var(--border-glass) !important;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .markdown-section pre code {
      background: transparent !important;
      border: none !important;
      color: var(--text) !important;
      padding: 0 !important;
    }

    /* ===== 表格 ===== */
    .markdown-section table thead {
      background: var(--bg-glass) !important;
      color: var(--text) !important;
    }
    .markdown-section table th, .markdown-section table td {
      border-color: var(--border-glass) !important;
      color: var(--text-secondary) !important;
    }

    /* ===== 引用块 ===== */
    .markdown-section blockquote {
      border-left: 4px solid var(--text-muted) !important;
      background: var(--bg-glass) !important;
      padding: 12px 20px !important;
      border-radius: 0 10px 10px 0 !important;
      color: var(--text-secondary) !important;
    }

    /* ===== 顶部导航 ===== */
    .app-nav {
      background: var(--bg-glass) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-bottom: 1px solid var(--border-glass) !important;
      padding: 12px 20px !important;
      border-radius: 16px !important;
      margin: 12px 16px 0 !important;
    }
    .app-nav a {
      color: var(--text-muted) !important;
      font-weight: 500 !important;
      transition: color 0.2s;
    }
    .app-nav a:hover { color: var(--text) !important; }
    .app-nav a::before { background: var(--text-muted) !important; }

    /* ===== 分页 ===== */
    .docsify-pagination-container {
      border-top: 1px solid var(--border-glass) !important;
      padding-top: 20px !important;
      margin-top: 32px !important;
    }
    .pagination-item:hover {
      background: var(--bg-glass) !important;
      border-radius: 8px !important;
    }

    /* ===== 搜索框 ===== */
    .search .input-wrap input {
      background: var(--bg-glass) !important;
      border: 1px solid var(--border-glass) !important;
      border-radius: 10px !important;
      padding: 8px 16px 8px 38px !important;
      color: var(--text) !important;
    }
    .search .input-wrap input:focus {
      border-color: var(--text-muted) !important;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.04) !important;
    }
    .search .input-wrap .search-icon {
      color: var(--text-muted) !important;
    }

    /* ===== 移动端菜单 ===== */
    .sidebar-toggle {
      background: var(--bg-glass) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--border-glass) !important;
      color: var(--text) !important;
      border-radius: 10px !important;
      box-shadow: 0 2px 16px rgba(0,0,0,0.15) !important;
    }

    /* ===== 删除 GitHub 角标 ===== */
    .github-corner {
      display: none !important;
    }

    /* ===== 隐藏封面页（如果存在） ===== */
    .cover {
      display: none !important;
    }

    /* ===== 滚动条 ===== */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--text-muted);
      border-radius: 4px;
      opacity: 0.3;
    }
    ::-webkit-scrollbar-thumb:hover { opacity: 0.8; }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .markdown-section { padding: 20px 18px 32px !important; border-radius: 16px !important; margin: 0 8px !important; }
      .app-nav { margin: 8px 8px 0 !important; padding: 10px 14px !important; border-radius: 14px !important; }
      .sidebar { background: rgba(10,10,18,0.80) !important; }
      [data-theme="light"] .sidebar { background: rgba(255,255,255,0.75) !important; }
    }
    @media (max-width: 480px) {
      .markdown-section { padding: 16px 12px 24px !important; border-radius: 14px !important; margin: 0 4px !important; }
    }
  </style>

</head>
<body>

  <!-- ===== 视频背景 ===== -->
  <video autoplay muted loop playsinline id="bg-video" poster="/bg_fufu_1080.png">
    <source src="/bg_fufu_1080.mp4" type="video/mp4">
    <img src="/bg1.webp" alt="背景" style="position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:-2;pointer-events:none;">
  </video>
  <div id="bg-overlay"></div>

  <div id="app"></div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

  <!-- ===== 主题切换脚本（使用 data-theme，不重载 CSS） ===== -->
  <script>
    (function() {
      var STORAGE_KEY = 'docsify-theme';
      var btn = document.getElementById('themeToggle');

      function setTheme(theme) {
        var isDark = (theme === 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.className = 'theme-toggle' + (isDark ? '' : ' light');
        localStorage.setItem(STORAGE_KEY, theme);
      }

      function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'dark';
        setTheme(current === 'dark' ? 'light' : 'dark');
      }

      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        setTheme(saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        setTheme('dark');
      } else {
        setTheme('light');
      }

      btn.addEventListener('click', toggleTheme);

      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (!localStorage.getItem(STORAGE_KEY)) {
            setTheme(e.matches ? 'dark' : 'light');
          }
        });
      } catch(e) {}
    })();
  </script>
